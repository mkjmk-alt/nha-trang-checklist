<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#075985" />
    <meta
      name="description"
      content="나트랑 여행 준비를 함께 확인하는 실시간 공동 체크리스트"
    />
    <title>나트랑 여행 준비 체크리스트</title>
    <link rel="stylesheet" href="./styles.css?v=20260810-3" />
  </head>
  <body>
    <a class="skip-link" href="#checklist">체크리스트로 바로가기</a>

    <header class="hero">
      <div class="hero__glow hero__glow--one"></div>
      <div class="hero__glow hero__glow--two"></div>
      <div class="hero__inner">
        <div class="eyebrow"><span aria-hidden="true">✦</span> NHA TRANG · VIETNAM</div>
        <h1>여행 전, 하나씩<br /><span>가볍게 체크해요.</span></h1>
        <p class="hero__copy">둘이 함께 준비하면 놓치는 것 없이, 출발은 더 설레게.</p>

        <div class="progress-card" aria-label="전체 진행률">
          <div class="progress-card__top">
            <div>
              <span class="progress-card__label">전체 준비 현황</span>
              <strong id="progressText">0 / 0 완료</strong>
            </div>
            <span class="progress-card__percent" id="progressPercent">0%</span>
          </div>
          <div
            class="progress-track"
            role="progressbar"
            aria-label="전체 체크리스트 진행률"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div class="progress-track__fill" id="progressFill"></div>
          </div>
          <div class="progress-card__bottom">
            <span id="requiredRemaining">필수 항목 계산 중</span>
            <span id="completionMessage">준비를 시작해 볼까요?</span>
          </div>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <section class="sync-panel" aria-labelledby="syncTitle">
        <div class="sync-panel__main">
          <div class="sync-icon" aria-hidden="true">↻</div>
          <div>
            <h2 id="syncTitle">공동 체크</h2>
            <div class="sync-status" id="syncStatus" role="status" aria-live="polite">
              <span class="status-dot"></span>
              <span id="syncStatusText">이 기기에 저장 중</span>
            </div>
            <p id="lastSyncText">공유를 시작하면 동행자와 자동 동기화됩니다.</p>
          </div>
        </div>
        <div class="sync-panel__actions">
          <button class="button button--primary" id="shareButton" type="button">
            <span aria-hidden="true">↗</span>
            <span id="shareButtonText">공유 시작</span>
          </button>
          <button class="button button--ghost" id="syncButton" type="button" hidden>
            지금 동기화
          </button>
        </div>
      </section>

      <section class="controls" aria-label="체크리스트 검색과 필터">
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <span class="sr-only">체크리스트 검색</span>
          <input id="searchInput" type="search" placeholder="여권, 보험, eSIM 검색" autocomplete="off" />
          <kbd>⌘ K</kbd>
        </label>

        <div class="filter-row" role="group" aria-label="항목 필터">
          <button class="filter-chip is-active" type="button" data-filter="all">전체 <span id="allCount">0</span></button>
          <button class="filter-chip" type="button" data-filter="incomplete">미완료 <span id="incompleteCount">0</span></button>
          <button class="filter-chip" type="button" data-filter="required">필수 <span id="requiredCount">0</span></button>
          <button class="filter-chip" type="button" data-filter="completed">완료 <span id="completedCount">0</span></button>
        </div>
      </section>

      <section id="checklist" class="checklist" aria-label="나트랑 준비 체크리스트"></section>

      <div class="empty-state" id="emptyState" hidden>
        <span aria-hidden="true">⌕</span>
        <strong>조건에 맞는 항목이 없어요.</strong>
        <p>검색어나 필터를 바꿔 보세요.</p>
      </div>

      <footer class="page-footer">
        <button class="text-button" id="resetButton" type="button">모든 체크 초기화</button>
        <p>체크 상태는 이 기기에 자동 저장되며, 공유방에서는 Cloudflare KV와 동기화됩니다.</p>
      </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./config.js?v=20260810-3"></script>
    <script src="./checklist.js?v=20260810-3"></script>
    <script src="./app.js?v=20260810-3"></script>
  </body>
</html>
